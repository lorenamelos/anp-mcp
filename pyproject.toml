[project]
name = "anp-mcp"
version = "0.1.0"
description = "MCP server for Brazilian oil production: ANP well-level data (2005 to today) harmonised and reconciled to ANP's national totals."
readme = "README.md"
license = "MIT"
keywords = ["mcp", "mcp-server", "brazil", "oil-and-gas", "anp", "open-data", "duckdb"]
authors = [
    { name = "Lorena Melo", email = "lorenamelo.engr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "huggingface-hub>=2.4.0",
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/lorenamelos/anp-mcp"
Repository = "https://github.com/lorenamelos/anp-mcp"
Dataset = "https://huggingface.co/datasets/lorenamelos/anp-oil-production"

[project.scripts]
anp-mcp = "anp_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.12.0",
    "kaleido>=1.5.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
